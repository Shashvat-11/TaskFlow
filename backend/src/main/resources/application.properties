spring.application.name=taskflow

# MySQL connection values must be supplied through the environment.
spring.datasource.url=${TASKFLOW_DB_URL}
spring.datasource.username=${TASKFLOW_DB_USERNAME}
spring.datasource.password=${TASKFLOW_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Keep schema changes explicit during this foundation phase.
spring.jpa.hibernate.ddl-auto=${TASKFLOW_JPA_DDL_AUTO:validate}
spring.jpa.open-in-view=false

taskflow.jwt.secret=${TASKFLOW_JWT_SECRET}
taskflow.jwt.expiration=${TASKFLOW_JWT_EXPIRATION:86400000}
